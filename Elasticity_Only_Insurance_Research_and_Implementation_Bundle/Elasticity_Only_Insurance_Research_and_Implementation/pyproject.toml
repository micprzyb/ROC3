[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticity-only-insurance"
version = "0.2.0"
description = "Real-data-only Bayes-flip elasticity models for randomized insurance price tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.8,<2",
  "lightgbm>=4.3,<5", "xgboost>=2.0,<4", "optuna>=4,<5", "pyyaml>=6", "joblib>=1.3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["elasticity_only*"]
